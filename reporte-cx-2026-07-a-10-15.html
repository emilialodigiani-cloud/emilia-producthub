"orders_total_puente": 9232, "orders_expired_puente": 8188}}, "lect": ["<b>La fricción está en el seguimiento del pedido y en la plata.<\/b> Entre los contactos transaccionales de compradores, «Seguimiento de pedido / envío» (48%), «Reembolso / reversión» (17%) y «Pedido de cancelación» (14%) explican 80% del volumen. 17,4% de las órdenes pagadas (173 de 994) tuvo al menos un contacto asociable por orden.", "<b>Dentro del recorrido, «En tránsito» concentra 33% de los contactos ubicables<\/b> (8.4 contactos cada 100 órdenes que pasaron por la etapa). Fuera del recorrido feliz, las órdenes canceladas generan 15.6 contactos cada 100, casi todos por reembolso: pocas órdenes, mucha fricción por unidad.", "<b>La promesa de 72 h hábiles no se cumplió en 173 de 715 entregas con historial de estados (24%), pero el cruce logístico no muestra una brecha de contactos:<\/b> fuera de PDT el contact rate de envío es 0.88x el de dentro de PDT. Con una brecha chica el patrón apunta más a comunicación/expectativa que a logística, pero solo 78 de 262 casos de envío traen una orden con historial (archivo 3), así que esta lectura es un piso, no un techo.", "<b>Casi nadie contacta por una compra que no se concretó:<\/b> solo 26 casos de Salesforce están asociados a órdenes expiradas (26 de 7.909 órdenes, 0,33%), sobre todo por cobertura de envío, cuotas y seguimiento.", "<b>El consultivo de compradores sobre registrados da 36%<\/b> (281 casos / 779 registrados). En vendedores se informa volumen: 87 casos consultivos, de los cuales 81 son prospectos o ex-vendedores de Hendyla que piden alta o migración y no están registrados."], "supu": ["Recontacto = otro caso posterior del mismo contacto y mismo motivo (misma orden si ambos tienen) dentro de 7 días, más casos hijos que citan el número del caso original; sensibilidad a 3 y 14 días. FCR calculado, no mostrado por decisión del usuario.", "Promesa de 72 h = 3 días hábiles desde la creación de la orden, sin sábados, domingos ni feriados informados (15/08 y 29/09). Dentro de PDT = entregada a tiempo o con la promesa todavía vigente; fuera de PDT = entregada tarde o sin entregar con la promesa vencida. Las canceladas antes de vencer quedan fuera de ambos grupos. Corte de datos: 15/10/2026 10:47.", "«Reclamo de envío» = caso transaccional del motivo Seguimiento de pedido / envío (cualquier tipo de registro) asociado por orden. Antes/después se compara por fecha (el caso trae solo fecha, sin hora).", "Etapa de la orden = estado vigente al mediodía de la fecha de apertura del caso (Salesforce no trae hora). «Lista para enviar» del export se muestra como «Lista para retirar». DELIVERY_FAILED = entrega fallida; RETURNED_TO_SELLER = devuelta al vendedor.", "Universo de órdenes = pagadas del archivo 2 (puente) desde el 01/07, más las del archivo 3 que todavía no figuran en el puente. El archivo 3 es histórico (desde el 17/07) y se usa solo para etapas y promesa de entrega, que necesitan fechas por estado. Las órdenes expiradas (intención de compra) se miran aparte, solo por el contacto que generan, y sus casos no entran en el contact rate transaccional ni en el consultivo.", "Contact rate consultivo de compradores = casos consultivos / usuarios registrados (779 acumulado y los registrados mensuales informados); se muestra también la tasa sobre activos como referencia. Para vendedores se informa volumen de casos, no tasa.", "Comprador / vendedor se asigna por contenido del caso (no hay campo en el export): vendedor = prospecto, ex-vendedor de Hendyla o comercio que escribe como tal. Los clusters se arman con la descripción libre porque la tipificación de Salesforce es poco confiable (555 casos con la tipificación genérica «Umarket»).", "Campaña ajena = todo caso de camiseta o remera de la selección, de Paraguay o albirroja, más cualquier otro de camiseta o remera (retiro, entrega, cancelación, cambio) que se asumió de la campaña; también los enlazados por caso u orden. También los casos de compradores que hablan de retiro en CE, sucursal o local (el marketplace solo envía a domicilio). Se salvan el Rally y las camisetas de clubes, y «talle» no es palabra clave. Contact rate transaccional por cohorte de creación de la orden; casos, clusters, canales y consultivo por mes de apertura. Octubre es parcial (hasta el 15/10)."]};

const S={tab:"kpi",scope:"all",win:"7",open:{},vb:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(x,d=1)=>x==null?"n/d":(x*100).toFixed(d).replace(".",",")+"%";
const num=x=>x==null?"n/d":Number(x).toLocaleString("es-AR");
const dec=(x,d=1)=>x==null?"n/d":Number(x).toFixed(d).replace(".",",");
const lowT=(t)=>t?t.toLowerCase():"—";
const COLORS={txb:"#C2410C",txs:"#D9A441",cb:"#2F6F8F",cs:"#7BA7BC",int:"#8B6BAE",sin:"#B8B5A8"};
const DCOL=[COLORS.txb,COLORS.txs,COLORS.cb,COLORS.cs,COLORS.int,COLORS.sin];
function seg(){return `<div class="seg" role="group" aria-label="Período">${SCOPES.map(([k,l])=>`<button data-act="scope" data-v="${k}" class="${S.scope===k?"on":""}">${l}</button>`).join("")}</div>`}
function header(){
 return `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
 <div style="display:flex;flex-direction:column;gap:6px">
  <div class="eyebrow">Customer Experience · Marketplace</div>
  <h1>Reporte CX · Julio a octubre 2026</h1>
  <div class="mute" style="font-size:15px">Rango analizado: 01/07/2026 a 15/10/2026 · primer reporte, acumulado y mes a mes</div>
 </div>
 <div class="seg" role="tablist">
  <button role="tab" aria-selected="${S.tab==="kpi"}" data-act="tab" data-v="kpi" class="${S.tab==="kpi"?"on":""}">KPIs</button>
  <button role="tab" aria-selected="${S.tab==="base"}" data-act="tab" data-v="base" class="${S.tab==="base"?"on":""}">Transparencia de la base</button>
 </div></div>`;
}
function ctxCards(r){
 const c=r.ctx;
 return `<div class="grid4">
 <div class="kpi"><div class="note">Compradores registrados</div><div class="v">${num(c.buyers)}</div><div class="small mute">${num(c.buyers_act)} activos · dato del formulario</div></div>
 <div class="kpi"><div class="note">Vendedores registrados</div><div class="v">${num(c.sellers)}</div><div class="small mute">${num(c.sellers_act)} activos · se informa volumen, no tasa</div></div>
 <div class="kpi"><div class="note">Órdenes del período</div><div class="v">${num(c.orders)}</div><div class="small mute">Pagadas · archivo 2 desde el 01/07 · ${num(c.orders_hist)} con historial (archivo 3)</div></div>
 <div class="kpi"><div class="note">Casos analizados</div><div class="v">${num(c.cases)}</div><div class="small mute">${num(c.tx_cases)} transaccionales · ${num(c.cons_cases)} consultivos · ${num(c.intent_cases)} intención de compra</div></div>
 </div>`;
}
function monthly(){
 const rows=X.monthly.map(m=>{
  const all=m.scope==="all", sel=m.scope===S.scope?" sel":"";
  const nm=m.label+(m.scope==="2026-10"?" *":"")+(m.scope==="2026-07"?" †":"");
  return `<tr class="${all?"tot":""}${sel}"><td class="key">${nm}</td>
  <td class="g">${num(m.orders)}</td><td>${num(m.cases)}</td><td>${num(m.tx)}</td><td>${num(m.cons)}</td>
  <td class="g key">${pct(m.crtx)}</td><td class="key">${pct(m.crcons,0)}</td>
  <td class="g key">${pct(m.rec7)}</td>
  <td class="g">${pct(m.pdt_in)}</td><td>${pct(m.pdt_out)}</td><td>${m.ratio==null?"n/d":dec(m.ratio,2)+"x"}</td></tr>`}).join("");
 return `<section class="card"><h2>Mes a mes</h2>
 <div class="note">Resumen comparable de los indicadores principales. Las columnas de orden (órdenes, CR transaccional, PDT) usan la cohorte de órdenes creadas en el mes; las de caso usan el mes de apertura.</div>
 <div class="scroll"><table class="mt" style="min-width:860px"><thead>
 <tr class="grp"><th></th><th colspan="4" class="g">Volumen</th><th colspan="2" class="g">Contact rate<br>compradores</th><th class="g">Recontacto</th><th colspan="3" class="g">Envío según promesa<br>de entrega (PDT)*</th></tr>
 <tr><th>Período</th>
 <th class="g">Órdenes<br>pagadas</th><th>Casos<br>analizados</th><th>Casos<br>transacc.</th><th>Casos<br>consult.</th>
 <th class="g">Transaccional<br>(s/ órdenes)</th><th>Consultivo<br>(s/ registrados)</th>
 <th class="g">A 7 días<br>(s/ casos)</th>
 <th class="g">Dentro<br>de PDT</th><th>Fuera<br>de PDT</th><th>Razón fuera<br>/ dentro</th>
 </tr></thead><tbody>${rows}</tbody></table></div>
 <div class="small mute">Octubre (*) es parcial (hasta el 15/10): no comparable con meses cerrados; sus órdenes aún tienen poco tiempo para generar contactos. Las columnas de promesa de entrega (PDT) usan solo el archivo 3 (histórico desde el 17/07, el único con historial de estados), por eso julio no tiene dato. El resto usa el archivo 2 como universo de órdenes. † Julio: casos desde el 01/07 y órdenes del archivo 2 desde esa fecha.</div></section>`;
}
function weekly(){
 const w=X.weekly, n=w.labels.length, W=720,H=290,L=58,Rr=662,T=34,B=236;
 const nice=m=>{const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p};
 const mo=nice(Math.max(...w.orders)), mc=nice(Math.max(...w.tx,...w.cons));
 const x=i=>L+(Rr-L)*i/(n-1), yo=v=>B-(B-T)*v/mo, yc=v=>B-(B-T)*v/mc;
 const line=(arr,y)=>arr.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
 const dots=(arr,y,c)=>arr.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${c}"><title>Semana del ${w.labels[i]}${i===n-1?"*":""}: ${v}</title></circle>`).join("");
 let grid="";for(let k=0;k<=4;k++){const yy=B-(B-T)*k/4;grid+=`<line x1="${L}" y1="${yy}" x2="${Rr}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" font-size="11" fill="var(--mute)" text-anchor="end">${Math.round(mo*k/4)}</text><text x="${Rr+6}" y="${yy+4}" font-size="11" fill="var(--mute)" text-anchor="start">${Math.round(mc*k/4)}</text>`}
 const xl=w.labels.map((l,i)=>`<text x="${x(i)}" y="${B+16}" font-size="10" fill="var(--mute)" text-anchor="middle" ${i%2?'opacity=".0"':''}>${l}${i===n-1?"*":""}</text>`).join("");
 const xl2=w.labels.map((l,i)=>i%2?`<text x="${x(i)}" y="${B+16}" font-size="10" fill="var(--mute)" text-anchor="middle">${l}${i===n-1?"*":""}</text>`:"").join("");
 const fo=x(w.first_orders_week);
 return `<section class="card"><h2>1. Evolución semanal: órdenes vs casos</h2>
 <div class="note">Órdenes creadas, casos transaccionales (incluye inferidos por contenido) y casos consultivos por semana. Las órdenes van en el eje izquierdo y los casos en el derecho, para comparar la forma de las tres líneas. La última semana (12–15/10) está incompleta (*). Órdenes pagadas según el archivo 2.</div>
 <div class="scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Líneas semanales de órdenes creadas, casos transaccionales y casos consultivos" style="width:100%;min-width:560px;height:auto;display:block">
 ${grid}
 <text x="${L-6}" y="${T-14}" font-size="11" fill="var(--mute)" text-anchor="end">Órdenes</text><text x="${Rr+6}" y="${T-14}" font-size="11" fill="var(--mute)" text-anchor="start">Casos</text>
 <text x="${(L+Rr)/2}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="middle">Semana (lunes de inicio)</text>
  <rect x="${x(n-1)-14}" y="${T}" width="28" height="${B-T}" fill="var(--soft)" opacity=".55"/>
 ${xl2}${w.labels.map((l,i)=>i%2===0?`<text x="${x(i)}" y="${B+16}" font-size="10" fill="var(--mute)" text-anchor="middle">${l}${i===n-1?"*":""}</text>`:"").join("")}
 <polyline points="${line(w.orders,yo)}" fill="none" stroke="#7A7770" stroke-width="2.5" stroke-dasharray="6 4"/>
 <polyline points="${line(w.tx,yc)}" fill="none" stroke="#C2410C" stroke-width="2.5"/>
 <polyline points="${line(w.cons,yc)}" fill="none" stroke="#2F6F8F" stroke-width="2.5"/>
 ${dots(w.orders,yo,"#7A7770")}${dots(w.tx,yc,"#C2410C")}${dots(w.cons,yc,"#2F6F8F")}
 </svg></div>
 <div class="legend"><span><span style="display:inline-block;width:18px;border-top:3px dashed #7A7770;margin-right:6px;vertical-align:middle"></span>Órdenes creadas (eje izq.)</span><span><span style="display:inline-block;width:18px;height:3px;background:#C2410C;margin-right:6px;vertical-align:middle"></span>Casos transaccionales (eje der.)</span><span><span style="display:inline-block;width:18px;height:3px;background:#2F6F8F;margin-right:6px;vertical-align:middle"></span>Casos consultivos (eje der.)</span></div></section>`;
}
function quotesBlock(quotes,key){
 if(!quotes||!quotes.length)return "";
 return `<details class="vb" data-k="${esc(key)}"${S.vb[key]?" open":""}><summary>Ver verbatims (${quotes.length})</summary>${quotes.map(q=>`<div class="quote">“${esc(q.text)}” · Caso ${q.id}</div>`).join("")}</details>`;
}
function clusterGroup(title,items,color,kp){
 if(!items||!items.length)return `<div><h4>Motivos · ${title}</h4><div class="note">Sin casos en este período.</div></div>`;
 const mx=Math.max(...items.map(i=>i.n));
 return `<div style="display:flex;flex-direction:column;gap:12px"><h4>Motivos · ${title}</h4>${items.map(it=>`<div style="display:flex;flex-direction:column;gap:4px">
  <div class="row"><span style="font-weight:600">${esc(it.name)}</span><span>${num(it.n)} · ${pct(it.pct,0)}</span></div>
  <div class="bar"><i style="width:${(it.n/mx*100).toFixed(1)}%;background:${color}"></i></div>
  ${quotesBlock(it.quotes,kp+"|"+it.name)}</div>`).join("")}</div>`;
}
function mixCell(m,tot){return TIPOS.map(t=>`<td>${tot?pct(m[t]/tot,0):"—"} <span class="small mute">(${m[t]})</span></td>`).join("")}
function sellerNote(r){
 const cl=r.clusters.cons.Vendedores||[];const tot=cl.reduce((a,c)=>a+c.n,0);
 const pro=cl.filter(c=>/Alta e incorporaci|Migraci/.test(c.name)).reduce((a,c)=>a+c.n,0);
 if(!tot)return "";
 return `<div class="banner" style="font-size:12px">De los ${num(tot)} casos consultivos de vendedores, ${num(pro)} (${pct(pro/tot,0)}) son <b>prospectos o ex-vendedores de Hendyla</b> (alta, incorporación, migración): no son vendedores registrados, por eso en vendedores se informa el volumen de casos y no una tasa.</div>`;
}
function crBlock(r,kind){
 const isTx=kind==="tx";
 const title=isTx?"Contact rate transaccional":"Contact rate consultivo";
 const def=isTx?"Poscompra: órdenes con contacto / órdenes pagadas del período (archivo 2; cohorte de creación; cuenta órdenes, no casos). En vendedores se informa volumen, no tasa. Solo entran los casos asociados a una orden; los inferidos por contenido son transaccionales pero no se pueden asignar a una orden concreta, así que se muestran aparte en la foto rápida y en los motivos.":"Casos consultivos / usuarios registrados del segmento (a modo de referencia se muestra también la tasa sobre usuarios activos). En vendedores se informa volumen, no tasa. Los casos de órdenes expiradas no entran: se analizan aparte en la sección 7.";
 const rows=["Compradores","Vendedores"].map(s=>{
  const c=r.cr[kind][s];
  const tot=isTx?c.cases:c.num;
  if(c.rate==null)return `<tr><td style="font-weight:600">${s}</td><td style="font-weight:600">${num(tot)} ${tot===1?"caso":"casos"}</td><td class="mute">volumen; no se mide como tasa</td>${mixCell(c.mix,tot)}</tr>`;
  return `<tr><td style="font-weight:600">${s}</td><td style="font-weight:600">${pct(c.rate)}</td><td class="mute">${num(c.num)} / ${num(c.den)} ${isTx?"órdenes":(s==="Compradores"?"compradores registrados":"vendedores registrados")}${isTx?"":`<div class="small">sobre activos: ${pct(c.rate_act)} (${num(c.num)} / ${num(c.den_act)})</div>`}</td>${mixCell(c.mix,tot)}</tr>`}).join("");
 const segs=["Compradores","Vendedores"].filter(s=>(r.clusters[kind][s]||[]).reduce((x,c)=>x+c.n,0)>=3);
 const grp=(segs.length?segs:["Compradores"]).map(s=>clusterGroup(s,r.clusters[kind][s],s==="Compradores"?"#C2410C":"#2F6F8F",S.scope+"|"+kind+"|"+s)).join("");
 return `<div class="inner"><div><h3>${title}</h3><div class="small mute">${def}</div></div>
 <div class="scroll"><table style="min-width:660px"><thead><tr><th>Segmento</th><th>Contact rate</th><th>Num. / Den.</th><th>Consulta</th><th>Solicitud</th><th>Reclamo</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="small mute">% de tipo de registro sobre los casos del segmento ${isTx?"asociados a orden":"consultivos"} (entre paréntesis, cantidad de casos).</div>${isTx?"":sellerNote(r)}
 <div class="two" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px">${grp}</div></div>`;
}
function s1(r){
 let acc=0;const stops=r.donut.map((d,i)=>{const col=DCOL[i];const a0=acc;acc+=d.share*100;return `${col} ${a0.toFixed(2)}% ${acc.toFixed(2)}%`}).join(",");
 const leg=r.donut.map((d,i)=>`<tr><td><span class="dot" style="background:${DCOL[i]};margin-right:8px;vertical-align:-1px"></span><span style="font-weight:600">${d.name}</span></td><td>${num(d.cases)}</td><td>${pct(d.share,0)}</td><td style="font-weight:600">${d.rate==null?(d.basis==="volumen"?"volumen":"—"):pct(d.rate)}</td></tr>`).join("");
 const sp=r.tx_split;
 const sin=r.sinid;
 return `<section class="card" style="gap:16px"><h2>2. Contact rate y motivos de contacto</h2>
 <div class="note">Cada tipo de contact rate (transaccional y consultivo) se muestra separado por comprador y vendedor y, debajo, sus motivos de contacto. La cantidad de clusters surge de los datos. Cada verbatim va sin datos personales y con su número de caso de Salesforce.</div>
 <div class="inner">
  <div class="note">Cómo se reparten los casos entre los 4 tipos de contact rate (más intención de compra y un grupo sin segmento). Transaccional: órdenes con contacto / órdenes. Consultivo de compradores: casos / usuarios registrados. Vendedores: volumen, no tasa.</div>
  <div class="donutrow">
   <div style="position:relative;width:180px;height:180px;flex:none"><div role="img" aria-label="Distribución de casos por tipo de contact rate" style="width:180px;height:180px;border-radius:50%;background:conic-gradient(${stops})"></div>
    <div style="position:absolute;top:34px;left:34px;width:112px;height:112px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:22px;font-weight:600">${num(r.ctx.cases)}</div><div class="small mute">casos analizados</div></div></div>
   <div class="scroll"><table class="dt"><thead><tr><th>Tipo de contacto</th><th>Casos</th><th>% del total</th><th>Contact rate</th></tr></thead><tbody>${leg}</tbody></table></div>
  </div>
  <div class="small mute">Transaccional = ${num(sp.orden)} casos con orden asociada + ${num(sp.inferido)} inferidos por contenido (los inferidos cuentan en los casos pero no en la tasa por orden). Intención de compra = ${num(sp.intent)} casos de órdenes que expiraron sin pago (sección 7).</div>
 </div>
 ${crBlock(r,"tx")}${crBlock(r,"cons")}
 <div class="inner"><h3>Sin segmento: spam, casos vacíos y abandono</h3><div class="small mute">${num(sin.n)} casos que no se pueden atribuir a un comprador o vendedor; no entran en ningún contact rate.</div>
 ${sin.clusters.map(c=>`<div class="row"><span style="font-weight:600">${esc(c.name)}</span><span>${num(c.n)} · ${pct(c.pct,0)}</span></div>`).join("")}</div>
 </section>`;
}
function s2(r){
 const mx=Math.max(...r.channels.map(c=>c.pct));
 return `<section class="card"><h2>3. Canales de contacto</h2>
 <div class="note">% de casos por canal, aperturado por tipo de registro. El largo de la barra es el peso del canal. Incluye todos los casos analizados.</div>
 ${r.channels.map(c=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-weight:600">${esc(c.name)}</span><span>${pct(c.pct,0)} · ${num(c.n)} casos · predomina ${c.top.toLowerCase()}</span></div>
 <div style="display:flex;width:${(c.pct/mx*100).toFixed(1)}%;min-width:8px;height:14px;border-radius:5px;overflow:hidden;background:var(--track)"><div style="height:100%;width:${c.mix.Consulta*100}%;background:#2F6F8F"></div><div style="height:100%;width:${c.mix.Solicitud*100}%;background:#D9A441"></div><div style="height:100%;width:${c.mix.Reclamo*100}%;background:#C2410C"></div></div>
 <div class="small mute">Consulta ${pct(c.mix.Consulta,0)} · Solicitud ${pct(c.mix.Solicitud,0)} · Reclamo ${pct(c.mix.Reclamo,0)}</div></div>`).join("")}
 <div class="legend"><span><span class="dot" style="background:#2F6F8F;width:10px;height:10px;margin-right:6px"></span>Consulta</span><span><span class="dot" style="background:#D9A441;width:10px;height:10px;margin-right:6px"></span>Solicitud</span><span><span class="dot" style="background:#C2410C;width:10px;height:10px;margin-right:6px"></span>Reclamo</span></div></section>`;
}
function s3(r){
 const rc=r.recontact, mat=r.matrix[S.win];
 const allN=Object.keys(mat);const names=allN.filter(n=>mat[n].total.rec>0).sort((a,b)=>mat[b].total.rec-mat[a].total.rec||mat[b].total.n-mat[a].total.n);const hid=allN.length-names.length;
 const cell=c=>{ if(!c.n)return `<td style="padding:8px 6px;border-radius:6px" class="mute">—</td>`; const rt=c.rec/c.n; const al=Math.min(.6,rt*2.2);
   return `<td style="padding:8px 6px;border-radius:6px;background:rgba(194,65,12,${al.toFixed(2)})">${c.rec} · ${pct(rt,0)}<div class="small mute">de ${c.n}</div></td>`};
 return `<section class="card"><h2>4. Recontacto</h2>
 <div class="note">Mismo contacto y mismo motivo dentro de la ventana (misma orden si la hay); incluye reaperturas y casos hijos. Solo ${pct(X.qual.contact_id_cov,0)} de los casos trae algún dato para reconocer al contacto, así que la tasa es un piso.</div>
 <div class="grid4" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${[["7","Recontacto 7 días",rc["7"],""],["3","Recontacto 3 días",rc["3"],"Sensibilidad"],["14","Recontacto 14 días",rc["14"],"Sensibilidad"]].map(([k,l,v,s])=>`<div class="inner" style="padding:12px;gap:2px"><div class="small mute">${l}</div><div style="font-size:24px;font-weight:600">${pct(v.rate)}</div><div class="small mute">${v.num} / ${v.den}${s?" · "+s:""}</div></div>`).join("")}</div>
 <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><h3 style="font-size:15px">Motivo x tipo de registro: casos recontactados y tasa de recontacto</h3>
 <div class="seg">${["3","7","14"].map(w=>`<button data-act="win" data-v="${w}" class="${S.win===w?"on":""}">${w} días</button>`).join("")}</div></div>
 <div class="small mute">Ventana: ${S.win} días. Cada celda: casos recontactados · tasa = recontactados / casos de ese motivo y tipo. Más oscuro = tasa más alta. Solo se muestran los motivos con al menos un recontacto${hid?` (${hid} motivos sin recontacto no se listan)`:""}.</div>
 <div class="scroll"><table style="border-collapse:separate;border-spacing:4px;min-width:640px"><thead><tr><th>Motivo</th><th>Consulta</th><th>Solicitud</th><th>Reclamo</th><th>Total motivo</th></tr></thead><tbody>
 ${names.map(n=>{const m=mat[n];return `<tr><td style="font-weight:600;padding:8px 6px">${esc(n)}</td>${cell(m.Consulta)}${cell(m.Solicitud)}${cell(m.Reclamo)}<td style="font-weight:600;padding:8px 6px">${m.total.rec} · ${pct(m.total.n?m.total.rec/m.total.n:null,0)}<div class="small mute" style="font-weight:400">de ${m.total.n}</div></td></tr>`}).join("")}
 </tbody></table></div></section>`;
}
function s4(r){
 const p=r.pdt;
 const g=(key,name,when,read)=>{const x=p[key];const w=x.rate?Math.max(2,x.rate*100):0;const open=S.open[key+S.scope];
  return `<div class="inner" style="gap:6px"><div class="row"><span style="font-weight:600">${name}</span><span>${num(x.orders)} órdenes</span></div>
  <button class="pdtbtn" data-act="open" data-v="${key}" aria-expanded="${!!open}" title="Casos de Salesforce: ${x.cases.length?x.cases.join(", "):"ninguno"}"><span style="display:block;height:100%;width:${w}%;background:#C2410C"></span></button>
  <div class="small mute">Pasá el mouse o hacé click en la barra para ver los números de caso de los contactos (la parte naranja es el % de órdenes con reclamo; el resto son órdenes sin reclamo).</div>
  ${open?`<div style="display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">${x.cases.length?x.cases.map(c=>`<span class="chip">${c}</span>`).join(""):'<span class="small mute">Sin casos</span>'}</div>`:""}
  <div class="row" style="font-size:13px"><span><b>${num(x.contact_orders)}</b> órdenes con reclamo de envío ${when}</span><span style="font-weight:600">Contact rate ${pct(x.rate)}</span></div>
  <div class="small mute">${read}</div></div>`};
 const ratio=p.ratio==null?"n/d":dec(p.ratio,2)+"x";
 return `<section class="card"><h2>5. Cruce logístico: órdenes vs contactos por PDT</h2>
 <div class="note">PDT = promise delivery time (72 h = 3 días hábiles desde la creación, sin sábados, domingos ni feriados 15/08 y 29/09). Sobre el total de órdenes de cada grupo, cuántas generaron un reclamo de envío antes de vencer la promesa y cuántas después de vencida. Usa solo el archivo 3 (histórico desde el 17/07, el único con fechas de cada estado): ${num(r.ctx.orders_hist)} de las ${num(r.ctx.orders)} órdenes del período. Solo cuenta casos asociados a esas órdenes.</div>
 ${g("dentro","Contactos por órdenes dentro de PDT","antes de vencer la promesa","Expectativa o comunicación: el cliente consulta antes de que la promesa venza.")}
 ${g("fuera","Contactos por órdenes fuera de PDT","después de vencida la promesa","Logístico: la orden no llegó dentro de la promesa y el cliente reclama.")}
 <div class="legend"><span><span class="dot" style="background:#C2410C;width:10px;height:10px;margin-right:6px"></span>Órdenes con reclamo de envío</span><span><span class="dot" style="background:#DAD7CB;width:10px;height:10px;margin-right:6px"></span>Órdenes sin reclamo</span></div>
 <div style="font-size:14px;background:var(--soft);border-radius:8px;padding:10px 12px">Fuera de PDT el contact rate es <b>${ratio}</b> el de dentro de PDT. Una brecha grande apunta a problema logístico; una brecha chica, a comunicación o producto. ${p.excl?`<span class="mute">(${p.excl} órdenes canceladas antes de vencer la promesa quedan fuera de ambos grupos.)</span>`:""}</div></section>`;
}
function stageRow(s,color){
 if(s.orders_pass==null&&!s.n)return "";
 return `<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-weight:600">${s.name}</span><span>${num(s.n)} · ${pct(s.pct,0)} · ${s.per100==null?"n/d":dec(s.per100)} c/100 órd.</span></div>
 <div class="bar l"><i style="width:${(s.pct*100).toFixed(1)}%;background:${color}"></i></div>
 <div class="small mute">${s.n?`Predomina ${lowT(s.top)} · motivo principal: ${s.reasons.map(x=>esc(x.name)+" ("+x.n+")").join(", ")} · compradores ${s.buyers}, vendedores ${s.sellers}${s.other?", sin segmento "+s.other:""}`:"Sin contactos"}${s.orders_pass==null?"":` · ${num(s.orders_pass)} órdenes pasaron por la etapa`}</div></div>`;
}
function s5(r){
 const hp=["Pagada","Preparando","Lista para retirar","En tránsito","Entregada"];
 const st=Object.fromEntries(r.stages.map(s=>[s.name,s]));
 const off=["Cancelada","Devuelta al vendedor","Entrega fallida"];
 const u=r.stages_unplaced;
 return `<section class="card"><h2>6. Contactos por etapa de la orden</h2>
 <div class="note">Etapa de la orden al momento del contacto transaccional (estado vigente al mediodía de la fecha del caso). Primero el recorrido feliz y después las órdenes que salieron de él. Usa el historial de estados del archivo 3 (desde el 17/07). Se ubican ${num(r.stages_total)} contactos con orden; no se pudieron ubicar: ${num(u.inferidos)} inferidos por contenido (sin orden), ${num(u.orden_fuera_archivo3)} con orden sin historial de estados (anterior al 17/07) y ${num(u.sin_dato)} sin dato de etapa. Las órdenes expiradas (intención de compra) no tienen etapa; sus contactos están en la sección 7.</div>
 ${hp.map(n=>stageRow(st[n],"#C2410C")).join("")}
 <h3 style="font-size:15px;margin-top:8px">Fuera del happy path</h3>
 ${off.map(n=>stageRow(st[n],"#7A7770")).join("")}</section>`;
}
function s6(r){
 const i=r.intencion;
 return `<section class="card"><h2>7. Contactos por intención de compra (órdenes expiradas)</h2>
 <div class="note">Una orden expirada es una compra que se inició y nunca se pagó. Los casos asociados a ellas se separan del poscompra: no entran en el contact rate transaccional ni en las etapas de la orden. Fuente de las órdenes: archivo 2 (hasta el 13/10).</div>
 <div class="grid4" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
  <div class="kpi"><div class="note">Casos asociados</div><div class="v">${num(i.cases_scope)}</div><div class="small mute">a una orden expirada</div></div>
  <div class="kpi"><div class="note">Órdenes expiradas con contacto</div><div class="v">${num(i.orders_contact)}</div><div class="small mute">de ${num(i.expiradas)} expiradas · ${pct(i.rate_contact,2)}</div></div>
 </div>
 <div class="small mute">Es una cota baja: la mayoría de las intenciones que no se concretan no genera contacto.</div>
 ${i.clusters.length?`<div style="display:flex;flex-direction:column;gap:12px">${i.clusters.map(c=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-weight:600">${esc(c.name)}</span><span>${num(c.n)} · ${pct(c.pct,0)}</span></div>${quotesBlock(c.quotes,S.scope+"|int|"+c.name)}</div>`).join("")}</div>`:'<div class="small mute">Sin casos en este período.</div>'}
 <details><summary class="small" style="cursor:pointer">Números de caso (${num(i.cases.length)})</summary><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${i.cases.map(c=>`<span class="chip">${c}</span>`).join("")}</div></details></section>`;
}
function reading(){
 return `<section style="background:var(--soft);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px"><h2 style="font-size:18px">Lectura y supuestos</h2>
 ${D.lect.map(t=>`<div style="font-size:14px;line-height:1.5">${t}</div>`).join("")}
 <h3 style="font-size:15px;margin-top:6px">Supuestos tomados</h3>
 <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--mute);line-height:1.5">${D.supu.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`;
}
function kpi(){
 const r=R[S.scope];
 return `<div style="display:flex;flex-direction:column;gap:28px">
 <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><span class="mute" style="font-size:14px">Vista:</span>${seg()}${S.scope==="2026-10"?'<span class="pill">Mes en curso incompleto: datos hasta el 15/10</span>':""}</div>
 ${ctxCards(r)}
 ${monthly()}
 ${weekly()}
 ${s1(r)}
 ${s2(r)}${s3(r)}
 ${s4(r)}${s5(r)}${s6(r)}
 ${reading()}</div>`;
}
function base(){
 const f=X.funnel, A=X.assoc, orig=f.orig;
 const row=(n,v,c,note)=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-weight:600">${n}</span><span>${num(v)} · ${pct(v/orig)}</span></div><div class="bar l"><i style="width:${(v/orig*100).toFixed(1)}%;background:${c}"></i></div><div class="small mute">${note}</div></div>`;
 const by=f.by;
 const kw=[["Prueba o modo test","prueba, pruebas, test, testing (en el asunto, o en la descripción cuando esta tiene 100 caracteres o menos; así se evitan falsos positivos como «se realizaron pruebas» en notas largas). Búsqueda sin distinguir mayúsculas ni tildes."],["Otras empresas","ubox"],["Campañas comerciales ajenas (remera de la selección de Paraguay)","albirroja; «remera» o «camiseta» seguida de «de la selección», «de Paraguay» o «paraguaya»; «selección paraguaya»; cualquier caso de camiseta o remera (retiro en centro de experiencia, entrega, cancelación, cambio u otro), salvo Rally y camisetas de clubes; casos que citan un caso de la campaña o comparten orden con uno; y casos de órdenes cuyo producto es la camiseta de la selección. También se descartan los casos de compradores (transaccionales y consultivos) que hablan de retiro en centro de experiencia, sucursal o local, porque el marketplace solo envía a domicilio y esos retiros corresponden a la campaña. «Talle» no es palabra clave. Las consultas del Rally se mantienen en la base, porque ocurrieron en la plataforma."],["Bug del bot (descartado de la base, contado en la limpieza)","caso de origen BOT, cerrado, sin asunto ni descripción"]];
 const mt=[["Por order ID",A["order ID"]],["Por cédula",A["cédula"]],["Por email",A["email"]],["Por nombre del cliente",A["nombre"]],["Inferido como transaccional por el contenido del caso (sin orden)",A.inferido],["Orden expirada (intención de compra, análisis aparte)",A.intencion],["Sin orden asociada (consultivo)",A.consultivo]];
 return `<div style="display:flex;flex-direction:column;gap:28px">
 <section class="card"><h2>De la base original a la base analizada</h2><div class="note">Cada caso descartado se cuenta una sola vez, en el primer motivo que aplica (prueba, otra empresa, campaña ajena, bug del bot). Original = descartados + analizados.</div>
 ${row("Casos originales",orig,"#7A7770","Export de Salesforce completo, 01/07 a 15/10")}
 ${row("Descartados: prueba o modo test",by["Prueba o modo test"],"#C2410C","Primer motivo aplicado")}
 ${row("Descartados: otras empresas (Ubox)",by["Otra empresa (Ubox)"],"#C2410C","Segundo motivo aplicado")}
 ${row("Descartados: campaña ajena (remera de la selección / albirroja)",by["Campaña ajena (camisetas selección)"],"#C2410C","Tercer motivo aplicado")}
 ${row("Descartados: bug del bot",by["Bug del bot (caso cerrado sin asunto ni descripción)"],"#C2410C","Casos que ingresaron cerrados, sin asunto ni descripción; no debieron crearse en Salesforce. Se cuentan en la limpieza, no en el análisis.")}
 ${row("Casos para el análisis",f.rest,"#2F6F8F","Base de todas las métricas. Verificación: "+num(orig)+" = "+num(orig-f.rest)+" descartados + "+num(f.rest)+" analizados")}</section>
 <div class="two">
 <section class="card"><h2>Cómo se asoció cada caso a una orden</h2><div class="note">Prioridad: order ID, cédula, email, nombre (solo si el match es único). Si un cliente tiene varias órdenes, se asigna la más reciente anterior al caso (asociación inferida).</div>
 ${mt.map(([n,v])=>`<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><span>${n}</span><span style="font-weight:600">${num(v)} · ${pct(v/A.total)}</span></div>`).join("")}
 <div class="small mute">Del total asociado por orden (${num(A["order ID"]+A["cédula"]+A.email+A.nombre)} casos, incluye ${num(A.intencion)} de órdenes expiradas): ${num(A.inferida)} son asociaciones inferidas por haber varias órdenes candidatas; ${num(A.orden_en_archivo3)} apuntan a órdenes con historial (archivo 3), ${num(A.orden_fuera_archivo3)} a órdenes pagadas solo presentes en el archivo 2 (sin historial) y ${num(A.orden_previa_periodo)} a órdenes anteriores al 01/07. Además, ${num(A.oid_sin_match)} casos citan un order ID que no existe en el puente.</div></section>
 <section class="card"><h2>Palabras clave de limpieza usadas</h2><div class="note">Definidas para este período en el formulario de entrada.</div>
 ${kw.map(([n,w])=>`<div style="border-top:1px solid var(--line);padding-top:8px"><div style="font-size:14px;font-weight:600">${n}</div><div class="note">${esc(w)}</div></div>`).join("")}</section></div>
 <section class="card"><h2>Calidad de los datos y puntos a confirmar</h2>
 <ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6">
 <li><b>El archivo 3 es histórico y arranca el 17/07</b> (no se puede modificar), por eso el universo de órdenes y el contact rate salen del archivo 2 (${num(X.qual.orders_universe)} órdenes pagadas desde el 01/07, incluidas las 21 más recientes que todavía no están en el puente). Etapas de la orden y promesa de entrega (PDT) usan solo el archivo 3 (${num(X.qual.orders_hist)} órdenes) porque el archivo 2 solo trae el estado actual, sin fechas por estado.</li>
 <li><b>Órdenes expiradas:</b> el puente trae ${num(X.qual.orders_total_puente)} órdenes únicas desde marzo, de las cuales ${num(X.qual.orders_expired_puente)} están expiradas (nunca pagadas). No entran al universo de órdenes; solo se muestran los contactos que generan, en la sección 7 (cubren hasta el 13/10).</li>
 <li><b>Base del consultivo:</b> el contact rate consultivo de compradores se mide sobre usuarios <b>registrados</b> (779 acumulados y los registrados mensuales informados). Subestima el denominador real porque consultan también personas que todavía no se registraron. En vendedores se informa <b>volumen</b>, no tasa: ${num(R.all.clusters.cons.Vendedores.filter(c=>/Alta|Migraci/.test(c.name)).reduce((a,c)=>a+c.n,0))} de los ${num(R.all.cr.cons.Vendedores.num)} casos son prospectos o ex-vendedores de Hendyla, que no están registrados.</li>
 <li><b>${num(X.qual.spam)} casos de spam y publicidad</b> (capacitaciones, Meta Verified, proveedores internacionales) y <b>${num(X.qual.sin_contenido_nobot)} casos vacíos o sin contenido</b> de otros canales siguen en la base, en el grupo «sin segmento», porque no estaban en las listas de limpieza. Se sugiere sumar palabras clave para el próximo reporte.</li>
 <li><b>Camisetas y remeras:</b> se descartaron ${num(X.funnel.by["Campaña ajena (camisetas selección)"])} casos de la campaña de la selección: ${num(X.qual.camp_explicitos)} dicen explícitamente selección, Paraguay o albirroja, ${num(X.qual.camp_retiro)} son retiros de camiseta o remera en centros de experiencia, ${num(X.qual.camp_generico)} hablan de camiseta o remera (entrega, cancelación, cambio) sin decir de cuál ${num(X.qual.camp_enlace)} se vinculan por caso u orden y ${num(X.qual.camp_tx_retiro)} son casos de compradores que hablan de retiro en centro de experiencia, sucursal o local. Los ${num(X.qual.camp_retiro+X.qual.camp_generico)} que no lo dicen expresamente se <b>asumieron</b> de la campaña. Quedan en la base los casos del Rally y los de camisetas de clubes, identificados por el producto de la orden.</li>
 <li><b>Comprador / vendedor</b> se asignó por contenido, no hay un campo en el export. <b>La tipificación de Salesforce</b> no es confiable (555 casos con la tipificación genérica «Umarket»), por eso los motivos se agrupan leyendo la descripción.</li>
 <li><b>Fecha del caso sin hora:</b> la etapa de la orden y el antes/después de la promesa se evalúan por día.</li>
 <li><b>Mes de la orden:</b> la columna «Mes» del archivo 3 difiere en 11 órdenes de la fecha de creación (parece estar en UTC); usé la fecha de creación.</li></ul></section>
 <section class="card"><h2>Casos inferidos como transaccionales por contenido (${num(X.inferred.length)})</h2><div class="note">Casos sin order ID y sin asociación por cédula, email o nombre, cuya descripción habla de una compra ya realizada. Se muestra número de caso y criterio que activó la inferencia.</div>
 <div class="maxh"><table><thead><tr><th>Caso</th><th>Fecha</th><th>Motivo</th><th>Criterio</th></tr></thead><tbody>${X.inferred.map(i=>`<tr><td style="font-weight:600">${i[0]}</td><td>${i[1]}</td><td>${esc(i[2])}</td><td class="mute">${esc(i[3])}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card"><h2>Casos descartados (solo IDs)</h2>
 <div class="maxh"><table><thead><tr><th>Caso</th><th>Fecha</th><th>Motivo de descarte</th><th>Palabra clave</th></tr></thead><tbody>${X.discarded.map(d=>`<tr><td style="font-weight:600">${d[0]}</td><td>${d[1]}</td><td>${esc(d[2])}</td><td class="mute">${esc(d[3])}</td></tr>`).join("")}</tbody></table></div>
 <div class="small mute">Sin nombres, cédulas, emails ni teléfonos. ${num(X.discarded.length)} casos.</div></section></div>`;
}
function render(){
 document.getElementById("app").innerHTML=header()+(S.tab==="kpi"?kpi():base());
}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.classList&&d.classList.contains("vb"))S.vb[d.dataset.k]=d.open;},true);
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,v=b.dataset.v,y=window.scrollY;
 if(a==="tab")S.tab=v; else if(a==="scope")S.scope=v; else if(a==="win")S.win=v; else if(a==="open"){const k=v+S.scope;S.open[k]=!S.open[k]}
 render();window.scrollTo(0,y);
});
render();
</script>
</body>
</html>
