ables<\/b> (8.4 contactos cada 100 órdenes que pasaron por la etapa). Fuera del recorrido feliz, las órdenes canceladas generan 15.6 contactos cada 100, casi todos por reembolso: pocas órdenes, mucha fricción por unidad.", "<b>La promesa de 72 h hábiles no se cumplió en 173 de 715 entregas con historial de estados (24%), pero el cruce logístico no muestra una brecha de contactos:<\/b> fuera de PDT el Contact Rate de envío es 0.88x el de dentro de PDT. Con una brecha chica el patrón apunta más a comunicación/expectativa que a logística, pero solo 78 de 262 casos de envío traen una orden con historial (archivo 3), así que esta lectura es un piso, no un techo.", "<b>El Contact Rate Consultivo de compradores es 0,12%<\/b> (279 casos / 227.000 usuarios únicos): consultan muy pocos de los usuarios que pasan por la plataforma, sobre todo por pagos y cuotas y por cobertura de envío. En vendedores se informa volumen: 89 casos consultivos, de los cuales 83 son prospectos o ex-vendedores de Hendyla que piden alta o migración y no están registrados."], "supu": ["Recontacto = otro caso posterior del mismo contacto y mismo motivo (misma orden si ambos tienen) dentro de 7 días, más casos hijos que citan el número del caso original; sensibilidad a 3 y 14 días. FCR calculado, no mostrado por decisión del usuario.", "Promesa de 72 h = 3 días hábiles desde la creación de la orden, sin sábados, domingos ni feriados informados (15/08 y 29/09). Dentro de PDT = entregada a tiempo o con la promesa todavía vigente; fuera de PDT = entregada tarde o sin entregar con la promesa vencida. Las canceladas antes de vencer quedan fuera de ambos grupos. Corte de datos: 15/10/2026 10:47.", "«Reclamo de envío» = caso transaccional del motivo Seguimiento de pedido / envío (cualquier tipo de registro) asociado por orden. Antes/después se compara por fecha (el caso trae solo fecha, sin hora).", "Etapa de la orden = estado vigente al mediodía de la fecha de apertura del caso (Salesforce no trae hora). «Lis   ${open?`<div style="display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">${x.cases.length?x.cases.map(c=>`<span class="chip">${c}</span>`).join(""):'<span class="small mute">Sin casos</span>'}</div>`:""}
  <div class="row" style="font-size:13px"><span><b>${num(x.contact_orders)}</b> órdenes con reclamo de envío ${when}</span><span style="font-weight:600">Contact Rate ${pct(x.rate)}</span></div>
  <div class="small mute">${read}</div></div>`};
 const ratio=p.ratio==null?"n/d":dec(p.ratio,2)+"x";
 return `<section class="card">${cardTitle("pdt","5. Cruce logístico: órdenes vs contactos por PDT")}
 <div class="note">PDT = promise delivery time (72 h = 3 días hábiles desde la creación, sin sábados, domingos ni feriados 15/08 y 29/09). Sobre el total de órdenes de cada grupo, cuántas generaron un reclamo de envío antes de vencer la promesa y cuántas después de vencida. Usa solo el archivo 3 (histórico desde el 17/07, el único con fechas de cada estado): ${num(r.ctx.orders_hist)} de las ${num(r.ctx.orders)} órdenes del período. Solo cuenta casos asociados a esas órdenes.</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
 ${g("dentro","Contactos por órdenes dentro de PDT","antes de vencer la promesa","Expectativa o comunicación: el cliente consulta antes de que la promesa venza.")}
 ${g("fuera","Contactos por órdenes fuera de PDT","después de vencida la promesa","Logístico: la orden no llegó dentro de la promesa y el cliente reclama.")}
 </div>
 <div class="legend"><span><span class="dot" style="background:var(--c-alert);width:10px;height:10px;margin-right:6px"></span>Órdenes con reclamo de envío</span><span><span class="dot" style="background:var(--track2);width:10px;height:10px;margin-right:6px"></span>Órdenes sin reclamo</span></div>
 <div style="font-size:14px;background:var(--soft);border-radius:8px;padding:10px 12px">Fuera de PDT el Contact Rate es <b>${ratio}</b> el de dentro de PDT. Una brecha grande apunta a problema logístico; una brecha chica, a comunicación o producto. ${p.excl?`<span class="mute">(${p.excl} órdenes canceladas antes de vencer la promesa quedan fuera de ambos grupos.)</span>`:""}</div></section>`;
}
function stageRow(s,color){
 if(s.orders_pass==null&&!s.n)return "";
 const cs=CASES.filter(c=>c.e===s.name&&(S.scope==="all"||c.h===S.scope));
 const mot={};cs.forEach(c=>{(mot[c.c]=mot[c.c]||[]).push(c)});
 const ms=Object.entries(mot).sort((a,b)=>b[1].length-a[1].length);
 const tp=x=>TIPOS.map(tt=>[tt,x.filter(c=>c.t===tt)]).filter(a=>a[1].length);
 const key=S.scope+"|etapa|"+s.name;
 return `<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-weight:600">${s.name}</span><span>${num(s.n)} · ${pct(s.pct,0)} · ${s.per100==null?"n/d":dec(s.per100)} c/100 órd.</span></div>
 <div class="bar l st">${tp(cs).map(([tt,a])=>`<i ${hv(s.name+" · "+tt,a)} style="width:${(s.pct*100*a.length/(cs.length||1)).toFixed(2)}%;background:${TCOL[tt]}"></i>`).join("")}</div>
 <div class="small mute">${s.n?tp(cs).map(([tt,a])=>`${tt} ${a.length}`).join(" · ")+` · compradores ${s.buyers}, vendedores ${s.sellers}${s.other?", sin segmento "+s.other:""}`:"Sin contactos"}${s.orders_pass==null?"":` · ${num(s.orders_pass)} órdenes pasaron por la etapa`}</div>
 ${ms.length?`<details class="vb" data-k="${esc(key)}"${S.vb[key]?" open":""}><summary>Ver motivos (${ms.length})</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${ms.map(([n,a])=>`<div><div class="row" style="font-size:13px;flex-wrap:nowrap"><span style="min-width:0">${esc(n)}</span><span style="white-space:nowrap"><b>${num(a.length)}</b> · ${pct(a.length/cs.length,0)}</span></div><div class="small mute" style="font-size:10px;display:flex;gap:10px;flex-wrap:wrap">${tp(a).map(([tt,b])=>`<span><i class="dot" style="background:${TCOL[tt]};width:8px;height:8px;margin-right:4px"></i>${tt} ${b.length}</span>`).join("")}</div></div>`).join("")}</div></details>`:""}</div>`;
}
function s5(r){
 const hp=["Pagada","Preparando","Lista para retirar","En tránsito","Entregada"];
 const st=Object.fromEntries(r.stages.map(s=>[s.name,s]));
 const off=["Cancelada","Devuelta al vendedor","Entrega fallida"];
 const u=r.stages_unplaced;
 return `<section class="card">${cardTitle("etp","6. Contactos por etapa de la orden")}
 <div class="note">Etapa de la orden al momento del contacto poscompra (estado vigente al mediodía de la fecha del caso). Cada barra se divide por tipo de registro y el desplegable abre los motivos de contacto de la etapa. Primero el recorrido feliz y después las órdenes que salieron de él. Usa el historial de estados del archivo 3 (desde el 17/07). Se ubican ${num(r.stages_total)} contactos con orden; no se pudieron ubicar: ${num(u.inferidos)} inferidos por contenido (sin orden), ${num(u.orden_fuera_archivo3)} con orden sin historial de estados (anterior al 17/07) y ${num(u.sin_dato)} sin dato de etapa. Las órdenes expiradas (intención de compra) no tienen etapa y no se analizan.</div>
 ${hp.map(n=>stageRow(st[n],"var(--c-pri)")).join("")}
 <h3 style="font-size:15px;margin-top:8px">Fuera del happy path</h3>
 ${off.map(n=>stageRow(st[n],"var(--c-grey)")).join("")}</section>`;
}
function reading(){
 return `<section style="background:var(--soft);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px"><h2 style="font-size:18px">Lectura y supuestos</h2>
 ${D.lect.map(t=>`<div style="font-size:14px;line-height:1.5">${t}</div>`).join("")}
 <h3 style="font-size:15px;margin-top:6px">Supuestos tomados</h3>
 <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--mute);line-height:1.5">${D.supu.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`;
}
function kpi(){
 const r=R[S.scope];
 return `<div style="display:flex;flex-direction:column;gap:28px">
 <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><span class="mute" style="font-size:14px">Vista:</span>${seg()}${S.scope==="2026-10"?'<span class="pill">Mes en curso incompleto: datos hasta el 15/10</span>':""}<button class="insbtn${S.insAll?" on":""}" data-act="insall" aria-pressed="${S.insAll}" style="margin-left:auto">${LAMP}<span>${S.insAll?"Ocultar hallazgos":"Ver todos los hallazgos"}</span></button></div>
 ${ctxCards(r)}
 ${monthly()}
 ${weekly()}
 ${s1(r)}
 ${s2(r)}${s3(r)}
 ${s4(r)}${s5(r)}
 ${reading()}</div>`;
}
function base(){
 const f=X.funnel, A=X.assoc, orig=f.orig;
 const row=(n,v,c,note)=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-weight:600">${n}</span><span>${num(v)} · ${pct(v/orig)}</span></div><div class="bar l"><i style="width:${(v/orig*100).toFixed(1)}%;background:${c}"></i></div><div class="small mute">${note}</div></div>`;
 const by=f.by;
 const kw=[["Prueba o modo test","prueba, pruebas, test, testing (en el asunto, o en la descripción cuando esta tiene 100 caracteres o menos; así se evitan falsos positivos como «se realizaron pruebas» en notas largas). Búsqueda sin distinguir mayúsculas ni tildes."],["Otras empresas","ubox"],["Campañas comerciales ajenas (remera de la selección de Paraguay)","albirroja; «remera» o «camiseta» seguida de «de la selección», «de Paraguay» o «paraguaya»; «selección paraguaya»; cualquier caso de camiseta o remera (retiro en centro de experiencia, entrega, cancelación, cambio u otro), salvo Rally y camisetas de clubes; casos que citan un caso de la campaña o comparten orden con uno; y casos de órdenes cuyo producto es la camiseta de la selección. También se descartan los casos de compradores (transaccionales y consultivos) que hablan de retiro en centro de experiencia, sucursal o local, porque el marketplace solo envía a domicilio y esos retiros corresponden a la campaña. «Talle» no es palabra clave. Las consultas del Rally se mantienen en la base, porque ocurrieron en la plataforma."],["Bug del bot (descartado de la base, contado en la limpieza)","caso de origen BOT, cerrado, sin asunto ni descripción"]];
 const mt=[["Por order ID",A["order ID"]],["Por cédula",A["cédula"]],["Por email",A["email"]],["Por nombre del cliente",A["nombre"]],["Inferido como transaccional por el contenido del caso (sin orden)",A.inferido],["Orden expirada (intención de compra, análisis aparte)",A.intencion],["Sin orden asociada (consultivo)",A.consultivo]];
 return `<div style="display:flex;flex-direction:column;gap:28px">
 <section class="card"><h2>De la base original a la base analizada</h2><div class="note">Cada caso descartado se cuenta una sola vez, en el primer motivo que aplica (prueba, otra empresa, campaña ajena, bug del bot). Original = descartados + analizados.</div>
 ${row("Casos originales",orig,"var(--c-grey)","Export de Salesforce completo, 01/07 a 15/10")}
 ${row("Descartados: prueba o modo test",by["Prueba o modo test"],"var(--c-pri)","Primer motivo aplicado")}
 ${row("Descartados: otras empresas (Ubox)",by["Otra empresa (Ubox)"],"var(--c-pri)","Segundo motivo aplicado")}
 ${row("Descartados: campaña ajena (remera de la selección / albirroja)",by["Campaña ajena (camisetas selección)"],"var(--c-pri)","Tercer motivo aplicado")}
 ${row("Descartados: bug del bot",by["Bug del bot (caso cerrado sin asunto ni descripción)"],"var(--c-pri)","Casos que ingresaron cerrados, sin asunto ni descripción; no debieron crearse en Salesforce. Se cuentan en la limpieza, no en el análisis.")}
 ${row("Casos para el análisis",f.rest,"var(--c-sec)","Base de todas las métricas. Verificación: "+num(orig)+" = "+num(orig-f.rest)+" descartados + "+num(f.rest)+" analizados")}</section>
 <div class="two">
 <section class="card"><h2>Cómo se asoció cada caso a una orden</h2><div class="note">Prioridad: order ID, cédula, email, nombre (solo si el match es único). Si un cliente tiene varias órdenes, se asigna la más reciente anterior al caso (asociación inferida).</div>
 ${mt.map(([n,v])=>`<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><span>${n}</span><span style="font-weight:600">${num(v)} · ${pct(v/A.total)}</span></div>`).join("")}
 <div class="small mute">Del total asociado por orden (${num(A["order ID"]+A["cédula"]+A.email+A.nombre)} casos, incluye ${num(A.intencion)} de órdenes expiradas): ${num(A.inferida)} son asociaciones inferidas por haber varias órdenes candidatas; ${num(A.orden_en_archivo3)} apuntan a órdenes con historial (archivo 3), ${num(A.orden_fuera_archivo3)} a órdenes pagadas solo presentes en el archivo 2 (sin historial) y ${num(A.orden_previa_periodo)} a órdenes anteriores al 01/07. Además, ${num(A.oid_sin_match)} casos citan un order ID que no existe en el puente.</div></section>
 <section class="card"><h2>Palabras clave de limpieza usadas</h2><div class="note">Definidas para este período en el formulario de entrada.</div>
 ${kw.map(([n,w])=>`<div style="border-top:1px solid var(--line);padding-top:8px"><div style="font-size:14px;font-weight:600">${n}</div><div class="note">${esc(w)}</div></div>`).join("")}</section></div>
 <section class="card"><h2>Calidad de los datos y puntos a confirmar</h2>
 <ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6">
 <li><b>El archivo 3 es histórico y arranca el 17/07</b> (no se puede modificar), por eso el universo de órdenes y el Contact Rate salen del archivo 2 (${num(X.qual.orders_universe)} órdenes pagadas desde el 01/07, incluidas las 21 más recientes que todavía no están en el puente). Etapas de la orden y promesa de entrega (PDT) usan solo el archivo 3 (${num(X.qual.orders_hist)} órdenes) porque el archivo 2 solo trae el estado actual, sin fechas por estado.</li>
 <li><b>Órdenes expiradas:</b> el puente trae ${num(X.qual.orders_total_puente)} órdenes únicas desde marzo, de las cuales ${num(X.qual.orders_expired_puente)} están expiradas (nunca pagadas). No entran al universo de órdenes ni se analizan; los casos asociados a ellas quedan fuera de las tasas.</li>
 <li><b>Base del consultivo:</b> el Contact Rate Consultivo de compradores se mide sobre <b>usuarios únicos</b> del período (227 mil en total y por mes los datos informados: 80,2 mil, 61,8 mil, 56,4 mil y 51,8 mil). En vendedores se informa <b>volumen</b>, no tasa: ${num(R.all.clusters.cons.Vendedores.filter(c=>/Alta|Migraci/.test(c.name)).reduce((a,c)=>a+c.n,0))} de los ${num(R.all.cr.cons.Vendedores.num)} casos son prospectos o ex-vendedores de Hendyla, que no están registrados.</li>
 <li><b>${num(X.qual.spam)} casos de spam y publicidad</b> (capacitaciones, Meta Verified, proveedores internacionales) y <b>${num(X.qual.sin_contenido_nobot)} casos vacíos o sin contenido</b> de otros canales siguen en la base, en el grupo «sin segmento», porque no estaban en las listas de limpieza. Se sugiere sumar palabras clave para el próximo reporte.</li>
 <li><b>Camisetas y remeras:</b> se descartaron ${num(X.funnel.by["Campaña ajena (camisetas selección)"])} casos de la campaña de la selección: ${num(X.qual.camp_explicitos)} dicen explícitamente selección, Paraguay o albirroja, ${num(X.qual.camp_retiro)} son retiros de camiseta o remera en centros de experiencia, ${num(X.qual.camp_generico)} hablan de camiseta o remera (entrega, cancelación, cambio) sin decir de cuál, ${num(X.qual.camp_enlace)} se vinculan por caso u orden y ${num(X.qual.camp_tx_retiro)} son casos de compradores que hablan de retiro en centro de experiencia, sucursal o local. Los ${num(X.qual.camp_retiro+X.qual.camp_generico)} que no lo dicen expresamente se <b>asumieron</b> de la campaña. Quedan en la base los casos del Rally y los de camisetas de clubes, identificados por el producto de la orden.</li>
 <li><b>Comprador / vendedor</b> se asignó por contenido, no hay un campo en el export. <b>La tipificación de Salesforce</b> no es confiable (555 casos con la tipificación genérica «Umarket»), por eso los motivos se agrupan leyendo la descripción.</li>
 <li><b>Fecha del caso sin hora:</b> la etapa de la orden y el antes/después de la promesa se evalúan por día.</li>
 <li><b>Mes de la orden:</b> la columna «Mes» del archivo 3 difiere en 11 órdenes de la fecha de creación (parece estar en UTC); usé la fecha de creación.</li></ul></section>
 <section class="card"><h2>Casos inferidos como transaccionales por contenido (${num(X.inferred.length)})</h2><div class="note">Casos sin order ID y sin asociación por cédula, email o nombre, cuya descripción habla de una compra ya realizada. Se muestra número de caso y criterio que activó la inferencia.</div>
 <div class="maxh"><table><thead><tr><th>Caso</th><th>Fecha</th><th>Motivo</th><th>Criterio</th></tr></thead><tbody>${X.inferred.map(i=>`<tr><td style="font-weight:600">${i[0]}</td><td>${i[1]}</td><td>${esc(i[2])}</td><td class="mute">${esc(i[3])}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card"><h2>Casos descartados (solo IDs)</h2>
 <div class="maxh"><table><thead><tr><th>Caso</th><th>Fecha</th><th>Motivo de descarte</th><th>Palabra clave</th></tr></thead><tbody>${X.discarded.map(d=>`<tr><td style="font-weight:600">${d[0]}</td><td>${d[1]}</td><td>${esc(d[2])}</td><td class="mute">${esc(d[3])}</td></tr>`).join("")}</tbody></table></div>
 <div class="small mute">Sin nombres, cédulas, emails ni teléfonos. ${num(X.discarded.length)} casos.</div></section></div>`;
}
function render(){
 tip.style.display="none";
 document.getElementById("app").innerHTML=header()+(S.tab==="kpi"?kpi():base());
}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.classList&&(d.classList.contains("vb")||d.classList.contains("acc")))S.vb[d.dataset.k]=d.open;},true);
const tip=document.createElement("div");tip.id="tip";tip.setAttribute("role","tooltip");document.body.appendChild(tip);
const LIM=24;
const idList=a=>a.slice(0,LIM).join(", ")+(a.length>LIM?` … +${a.length-LIM} más`:"");
function weekTip(i){
 const w=X.weekly,last=i===w.labels.length-1;
 const tx=CASES.filter(c=>c.w===i&&isTx(c)).map(c=>c.id), cs=CASES.filter(c=>c.w===i&&c.k==="C").map(c=>c.id);
 return `<b>Semana del ${w.labels[i]}${last?" · incompleta":""}</b>
 <div class="k"><span><i style="background:var(--c-grey)"></i>Órdenes</span><b>${num(w.orders[i])}</b></div>
 <div class="k"><span><i style="background:var(--c-pri)"></i>Casos transaccionales</span><b>${num(tx.length)}</b></div>
 <div class="ids">${tx.length?idList(tx):"—"}</div>
 <div class="k"><span><i style="background:var(--c-sec)"></i>Casos consultivos</span><b>${num(cs.length)}</b></div>
 <div class="ids">${cs.length?idList(cs):"—"}</div>`;
}
function idTip(el){
 const ids=el.dataset.ids?el.dataset.ids.split(","):[];
 const by={Consulta:[],Solicitud:[],Reclamo:[]};
 ids.forEach(id=>{const c=CMAP[id];if(c)by[c.t].push(id);});
 let h=`<b>${esc(el.dataset.ttl)}</b><div class="k"><span>${num(ids.length)} ${ids.length===1?"caso":"casos"}</span></div>`;
 TIPOS.forEach(tp=>{if(by[tp].length)h+=`<div class="ids"><span class="tg"><i style="background:${TCOL[tp]}"></i>${tp} (${by[tp].length})</span> ${idList(by[tp])}</div>`;});
 return h;
}
function showTip(e){
 const el=e.target.closest&&e.target.closest("[data-hv],.wkhit");
 if(!el){tip.style.display="none";return;}
 tip.innerHTML=el.classList.contains("wkhit")?weekTip(+el.dataset.wk):idTip(el);
 tip.style.display="block";
 const r=tip.getBoundingClientRect();
 let x=e.clientX+14,y=e.clientY-r.height-10;
 if(x+r.width>window.innerWidth-8)x=e.clientX-r.width-14;
 if(y<8)y=e.clientY+16;
 if(y+r.height>window.innerHeight-8)y=Math.max(8,window.innerHeight-r.height-8);
 tip.style.left=Math.max(8,x)+"px";tip.style.top=y+"px";
}
document.addEventListener("pointermove",showTip);
document.addEventListener("pointerdown",showTip);
document.addEventListener("pointerout",e=>{if(!e.relatedTarget)tip.style.display="none";});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,v=b.dataset.v,y=window.scrollY;
 if(a==="tab")S.tab=v; else if(a==="mview")S.mview=v; else if(a==="ins"){if(S.insAll){S.insAll=false;Object.keys(INS).forEach(k=>{S.ins[k]=(k!==v)})}else S.ins[v]=!S.ins[v]} else if(a==="how")S.how=!S.how; else if(a==="insall"){S.insAll=!S.insAll;if(!S.insAll)S.ins={}} else if(a==="scope")S.scope=v; else if(a==="win")S.win=v; else if(a==="open"){const k=v+S.scope;S.open[k]=!S.open[k]}
 render();window.scrollTo(0,y);
});
render();
</script>
